name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    if: ${{ (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')) && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(main): release ')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.24.4"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Show Go version
        run: go version

      - name: Run tests
        run: go test ./...
